<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="topo">
        <div class="container">
            <strong>Newsletter</strong>
            <button id="btnTema" class="btn">Alternar Tema 🌓</button>
        </div>
    </header>
    <main class="container">
        <section class="caixa"> 
        <h1>Inscreva-se</h1>
        <p>Receba nossas novidades no seu email. Sem Spam.</p>

        <form>
            <label for="Nome">Nome</label>
            <input type="text" name="nome" id="nome" placeholder="Seu nome">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nome@email.com">

            <button type="submit" class="btn primario">Quero receber</button>
        </form>
    </section>
    </main>

    <footer class="rodape">
        <div class="container">
            <small>Newsletter <span id="ano"></span></small>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de login</title>
    <link rel="stylesheet" href="style.css"> 
    
    <!-- //*Ponto de partida onde o css roda*// -->

</head>
<body>
    <form action="">
    <div class="titulo">    
    <h1>Faça o seu login</h1>
    <div class="barra-horizontal"></div>

<div class="campo-input">
<label for="">Seu e-mail*</label>
<input type="e-mail" id="e-mail"/> 

<!-- //*o type atua como a barra que tem para digitar, deve programa-la para receber o item, sendo número ou letra*// -->

</div>

<div class="campo-input">
<label for="password">Sua senha*</label> 

<!-- //*o type atua como a barra que tem para digitar, deve programa-la para receber o item, sendo número ou letra*// -->

<input type="password" id="password" />
</div>

<div class="lembrar-me">
<p>Lembra-me</p>
<input type="checkbox"> 

<!-- //*caixinha que desmarca e marca*// -->

</div>

<button>Entrar</button>

<p class="esqueceu-senha">
<p>Esqueceu sua senha? <a href="https://www.linkedin.com/in/gabriel-carvalho-de-oliveira-36394016a/">Clque aqui!</a></p>


</body>

</form>

</html>


<!-- A base para esse arquivo e esse login/ senha é o html, o CSS é a parte criativa e onde aplica as modificações e deixar mais amigavel

"form" é um conjunto dentro de um código
"Div" são pequenas sessões
alt + z(atalho)
ctrl + ;(atalho)
-->
